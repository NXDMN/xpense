[versions]
agp = "8.12.0"
kotlin = "2.2.0"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycle = "2.9.2"
activityCompose = "1.10.1"
composeBom = "2025.07.00"
json = "1.9.0"
serialization = "2.2.0"
room = "2.7.2"
ksp = "2.2.0-2.0.2"
coroutines = "1.10.2"
nav = "2.9.3"
datastore = "1.1.7"
protobuf = "0.9.5"
protobufKotlinLite = "4.31.1"
camerax = "1.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
